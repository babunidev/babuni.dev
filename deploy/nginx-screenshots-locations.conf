# Development screenshots at https://www.babuni.dev/screenshots/<project>/<folder>/[thumbs/]<name>.webp
#
# Installed by deploy/install-screenshots-location.sh as
# /etc/nginx/snippets/babuni-screenshots-locations.conf and included in the HTTPS babuni.dev server
# block. The files live in /var/www/babuni.dev/shared/screenshots/, outside the release folders, so
# publish-site.sh never replaces or deletes them; scripts/publish-screenshots.sh uploads them.
# ^~ wins over the server block's general .webp rule. Only WebP files with checked names are served.

location ^~ /screenshots/ {
    root /var/www/babuni.dev/shared;
    location ~ "^/screenshots/[a-z0-9]+(-[a-z0-9]+)*/[a-z0-9]+(-[a-z0-9]+)*/(thumbs/)?[a-z0-9]+(-[a-z0-9]+)*\.webp$" {
        try_files $uri =404;
        # Names are never reused for different images, so browsers may keep them for 30 days.
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    return 404;
}
