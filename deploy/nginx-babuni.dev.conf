# Prepared HTTP site for /etc/nginx/sites-available/babuni.dev.
# Not installed. Use only after the separate static release directory exists.
# Keep the arcanitebrothers.com configuration untouched.
# Once DNS resolves here, Certbot can add HTTPS for www.babuni.dev to THIS site.
server {
    listen 80;
    listen [::]:80;
    server_name www.babuni.dev;
    root /var/www/babuni.dev/current;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml text/xml text/markdown image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Revalidate HTML and stable-name JSON/Markdown on each visit/update.
    add_header Cache-Control "no-cache" always;

    # Only fingerprinted Astro assets are immutable.
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    # Supplied artwork/media filenames can be updated: use a modest lifetime.
    location ~* \.(?:webp|mp4|webm)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }
    location /_project-docs/ {
        types { text/markdown md; }
        try_files $uri =404;
    }
    location ~ /\.(?!well-known/) { deny all; }
    # Real missing routes return 404, never the grid with a misleading 200.
    location / { try_files $uri $uri/ =404; }
}
